
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تركي بالعربي AI</title>
<style>
body{margin:0;padding:20px;background:#101827;color:white;font-family:Arial;text-align:center}
h1{color:#e8bd62;margin-top:35px}
.card{background:#1d2b40;padding:25px;border-radius:18px;margin-top:35px}
button{width:100%;padding:16px;background:#d5ae5c;border:0;border-radius:10px;font-size:18px;font-weight:bold;margin-top:20px}
input{margin:20px 0;max-width:100%}
select{width:100%;padding:13px;border-radius:10px;margin-top:10px}
p{line-height:2;color:#cbd5e1}
</style>
</head>
<body>
<h1>🎬 تركي بالعربي AI</h1>
<p>دبلجة المسلسلات التركية إلى العربية بالذكاء الاصطناعي</p>
<div class="card">
<h2>📁 اختر الحلقة التركية</h2>
<input type="file" id="video" accept="video/*">
<h3>لغة الدبلجة</h3>
<select><option>العربية الفصحى المبسطة</option></select>
<h3>الصوت</h3>
<select><option>أصوات طبيعية مثل دبلجة المسلسلات</option></select>
<button onclick="alert('تم اختيار الفيديو، محرك الدبلجة قيد التجهيز')">ابدأ الدبلجة العربية</button>
</div>
<section dir="rtl" style="text-align:center; padding:25px; background:#172554; color:white; border-radius:15px; margin:20px;">
  <h2>🎬 دبلجة المسلسلات التركية</h2>
  <p>ارفع الحلقة التركية للبدء</p>

  <label for="episode" style="display:block; background:#16a34a; padding:15px; border-radius:10px; cursor:pointer; font-weight:bold;">
    📁 اختر الحلقة التركية
  </label>

  <input id="episode" type="file" accept="video/*" style="display:none" onchange="showEpisode(this)">

  <p id="fileName">لم يتم اختيار أي حلقة بعد</p>
</section>

<script>
function showEpisode(input) {
  const file = input.files[0];
  if (file) {
    document.getElementById("fileName").textContent =
      "تم اختيار الحلقة: " + file.name;
  }
}
</script>
</body>
</html>
